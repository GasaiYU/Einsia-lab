name: Deploy to GitHub Pages

on:
  push:
    branches: [phys-last-exam]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate committed video resources
        run: npm run validate:phys-last-exam

      - name: Test project-site URL handling
        run: node --test scripts/prepare-pages.test.mjs

      - name: Build
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}

      - name: Prepare URLs for the repository Pages address
        run: node scripts/prepare-pages.mjs
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Check deployable resources and Pages size budget
        run: npm run validate:phys-last-exam -- --root dist
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
